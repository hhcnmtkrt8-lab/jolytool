<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Metal wall repair patch with fiberglass mesh border">
  <defs>
    <pattern id="mesh" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f8f6f0"/>
      <path d="M0 0H16M0 0V16" stroke="#b6ad99" stroke-width="1.3"/>
    </pattern>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f1ee"/>
      <stop offset="0.5" stop-color="#dcdad4"/>
      <stop offset="1" stop-color="#c3c1ba"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="800" height="800" fill="#f1eee6"/>
  <g transform="translate(-152 -211) scale(1.38)">
  <ellipse cx="400" cy="620" rx="210" ry="26" fill="#1b1e22" opacity="0.10" filter="url(#soft)"/>

  <g transform="rotate(-4 400 400)">
    <rect x="200" y="240" width="400" height="400" fill="url(#mesh)" stroke="#bcb3a0" stroke-width="2"/>
    <rect x="250" y="290" width="300" height="300" rx="6" fill="url(#metal)" stroke="#a9a7a1" stroke-width="2"/>
    <path d="M250 350 H550" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <path d="M250 530 H550" stroke="#9d9b95" stroke-width="1" opacity="0.4"/>

    <g fill="#b2471f" opacity="0.85">
      <path d="M262 302 h14 v2 h-14 z"/>
      <path d="M524 302 h14 v2 h-14 z"/>
      <path d="M262 576 h14 v2 h-14 z"/>
      <path d="M524 576 h14 v2 h-14 z"/>
    </g>

    <g fill="none" stroke="#a9a7a1" stroke-width="2">
      <circle cx="400" cy="440" r="46"/>
      <path d="M354 440 H446 M400 394 V486"/>
    </g>
  </g>
  </g>
</svg>
