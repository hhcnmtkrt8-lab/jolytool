<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Roll of thin fiberglass tissue mat tape">
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e4d7"/>
      <stop offset="0.42" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#e0dacb"/>
    </linearGradient>
    <pattern id="fibre" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#faf8f2"/>
      <path d="M0 5 H10" stroke="#cec5b2" stroke-width="0.9"/>
      <path d="M5 0 V10" stroke="#e6e0d0" stroke-width="0.6"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="800" height="800" fill="#191d21"/>
  <g transform="translate(-70 -85) scale(1.06)">
  <ellipse cx="330" cy="612" rx="160" ry="24" fill="#1b1e22" opacity="0.10" filter="url(#soft)"/>

  <g transform="rotate(6 530 470)">
    <rect x="440" y="410" width="270" height="86" fill="url(#fibre)" stroke="#cec5b2" stroke-width="2" opacity="0.9"/>
    <rect x="440" y="486" width="270" height="8" fill="#b2471f" opacity="0.35"/>
  </g>

  <path d="M180 320 V580 A150 38 0 0 1 480 580 V320 Z" fill="url(#side)" opacity="0.96"/>
  <path d="M180 320 V580 A150 38 0 0 1 480 580 V320 Z" fill="url(#fibre)" opacity="0.75"/>
  <ellipse cx="330" cy="320" rx="150" ry="38" fill="#fdfbf6" stroke="#cec5b2" stroke-width="2"/>
  <ellipse cx="330" cy="320" rx="46" ry="12" fill="#efece4" stroke="#cec5b2" stroke-width="2"/>
  <path d="M330 300 v-8" stroke="#b2471f" stroke-width="2" opacity="0.55"/>
  </g>
</svg>
