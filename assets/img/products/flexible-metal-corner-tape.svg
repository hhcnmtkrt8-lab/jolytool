<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Flexible metal corner tape with two galvanized strips">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9b7b1"/>
      <stop offset="0.4" stop-color="#ecebe7"/>
      <stop offset="1" stop-color="#a9a7a1"/>
    </linearGradient>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#f6f2e7"/>
      <circle cx="12" cy="12" r="2.2" fill="#c7beab"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
