  <path d="M270 165 H440 V460 H700 V600 H270 Z" fill="url(#paper)" stroke="#bcb3a0" stroke-width="2"/>

  <rect x="288" y="182" width="14" height="418" fill="url(#steel)" stroke="#9d9b95" stroke-width="1"/>
  <rect x="418" y="182" width="14" height="278" fill="url(#steel)" stroke="#9d9b95" stroke-width="1"/>
  <rect x="452" y="468" width="248" height="14" fill="url(#steel)" stroke="#9d9b95" stroke-width="1"/>
  <rect x="452" y="586" width="248" height="14" fill="url(#steel)" stroke="#9d9b95" stroke-width="1"/>

  <path d="M432 460 L432 486 L458 460 Z" fill="#b2471f" opacity="0.85"/>
  <path d="M270 600 H700" stroke="#b2471f" stroke-width="3" opacity="0.35"/>
  </g>
