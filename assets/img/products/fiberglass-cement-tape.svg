<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Fiberglass cement tape roll on a cement board">
  <defs>
    <pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f8f6f0"/>
      <path d="M0 0H14M0 0V14" stroke="#b6ad99" stroke-width="1.3"/>
    </pattern>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3ddd0"/>
      <stop offset="0.4" stop-color="#f8f5ed"/>
      <stop offset="1" stop-color="#dcd5c5"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dedbd2"/>
      <stop offset="1" stop-color="#c9c5ba"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="800" height="800" fill="#f1eee6"/>
  <g transform="translate(0 -51) scale(1)">

  <rect x="120" y="500" width="560" height="180" rx="4" fill="url(#board)"/>
  <path d="M120 560 H680" stroke="#bdb8ac" stroke-width="1.5" opacity="0.7"/>
  <circle cx="180" cy="540" r="5" fill="#a9a49a"/>
  <circle cx="620" cy="540" r="5" fill="#a9a49a"/>
  <circle cx="180" cy="640" r="5" fill="#a9a49a"/>
  <circle cx="620" cy="640" r="5" fill="#a9a49a"/>
  <ellipse cx="400" cy="694" rx="250" ry="18" fill="#1b1e22" opacity="0.12" filter="url(#soft)"/>

  <g transform="rotate(-3 400 400)">
    <path d="M250 230 V470 A150 40 0 0 1 550 470 V230 Z" fill="url(#side)"/>
    <path d="M250 230 V470 A150 40 0 0 1 550 470 V230 Z" fill="url(#mesh)" opacity="0.9"/>
    <ellipse cx="400" cy="230" rx="150" ry="40" fill="#fdfbf6" stroke="#bcb3a0" stroke-width="2"/>
    <ellipse cx="400" cy="230" rx="44" ry="11" fill="#efece4" stroke="#bcb3a0" stroke-width="2"/>
  </g>

  <path d="M120 500 H680" stroke="#b2471f" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
