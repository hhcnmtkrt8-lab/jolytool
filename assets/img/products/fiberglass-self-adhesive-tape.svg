<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Fiberglass self-adhesive mesh tape roll with unrolled strip">
  <defs>
    <pattern id="mesh" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f8f6f0"/>
      <path d="M0 0H16M0 0V16" stroke="#b8af9b" stroke-width="1.3"/>
    </pattern>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3ddd0"/>
      <stop offset="0.35" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#dcd5c5"/>
    </linearGradient>
    <radialGradient id="top" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#fcfaf5"/>
      <stop offset="1" stop-color="#e7e1d3"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="800" height="800" fill="#191d21"/>
  <g transform="translate(-57 -65) scale(1.04)">
  <ellipse cx="325" cy="612" rx="155" ry="24" fill="#1b1e22" opacity="0.10" filter="url(#soft)"/>

  <g transform="rotate(-5 555 470)">
    <rect x="468" y="430" width="240" height="88" fill="url(#mesh)" stroke="#bcb3a0" stroke-width="2"/>
    <rect x="468" y="506" width="240" height="12" fill="#b2471f" opacity="0.6"/>
  </g>

  <path d="M170 300 V588 A155 42 0 0 1 480 588 V300 Z" fill="url(#side)"/>
  <path d="M170 300 V588 A155 42 0 0 1 480 588 V300 Z" fill="url(#mesh)" opacity="0.9"/>
  <ellipse cx="325" cy="300" rx="155" ry="42" fill="url(#top)" stroke="#bcb3a0" stroke-width="2"/>
  <ellipse cx="325" cy="300" rx="46" ry="12" fill="#efece4" stroke="#bcb3a0" stroke-width="2"/>
  <path d="M325 288 v-6" stroke="#b2471f" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
